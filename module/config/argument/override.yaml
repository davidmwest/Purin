# --------------------
# Define non-modifiable values
# --------------------

# ==================== Alas ====================

Restart:
  Scheduler:
    Enable:
      type: state
      value: true
      option: [ true, ]
      option_bold: [ true, ]
    SuccessInterval: 0
    FailureInterval: 0
    ServerUpdate: 00:00

# ==================== Farm ====================

Main:
  Campaign:
    Event: campaign_main
Main2:
  Campaign:
    Event: campaign_main
Main3:
  Campaign:
    Event: campaign_main
CampaignStars:
  Campaign:
    Name:
      value: 1-1
      display: display
    Event: campaign_main
    Mode: normal
    UseClearMode: false
    UseAutoSearch: false
    Use2xBook: false
  StarPass:
    CompleteStory: false
EventStars:
  Campaign:
    Name: T1
    Mode: normal
    UseClearMode: false
    UseAutoSearch: false
    Use2xBook: false
  StarPass:
    EndStage: 16-4
EventExtra:
  Campaign:
    Name: EX
    Mode: normal
    UseClearMode: false
    UseAutoSearch: false
    Use2xBook: false
GemsFarming:
  Campaign:
    Mode: normal
    UseClearMode: true
    UseFleetLock: true
    Use2xBook: false
    AmbushEvade: true
  StopCondition:
    RunCount: 0
    MapAchievement: non_stop
    StageIncrease: false
    GetNewShip: false
    ReachLevel: 0
  Fleet:
    FleetOrder:
      display: display
      value: fleet1_all_fleet2_standby
      option: [ fleet1_all_fleet2_standby, fleet1_standby_fleet2_all ]
  Emotion:
    Mode: calculate_ignore
    Fleet1Control: prevent_red_face
    Fleet1Recover: not_in_dormitory
    Fleet1Oath: false
    Fleet2Value: 119
    Fleet2Record: 2020-01-01 00:00:00
    Fleet2Control: prevent_red_face
    Fleet2Recover: not_in_dormitory
    Fleet2Oath: false
  Submarine:
    Mode:
      display: display
      value: do_not_use
      option: [ do_not_use, hunt_only ]
    AutoSearchMode: sub_standby
    DistanceToBoss: use_open_ocean_support

