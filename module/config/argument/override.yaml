    SuccessInterval: 30-60
    FailureInterval: 120-240
    ServerUpdate: 00:00
Research:
  Scheduler:
    SuccessInterval: 30-60
    FailureInterval: 30-60
    ServerUpdate: 00:00
Dorm:
  Scheduler:
    SuccessInterval: 278
    FailureInterval: 278
    ServerUpdate: 00:00
DormDaily:
  Scheduler:
    SuccessInterval: 1440
    FailureInterval: 30
    ServerUpdate: 00:00
DormRest:
  Scheduler:
    SuccessInterval: 60
    FailureInterval: 60
EnhanceShips:
  Scheduler:
    SuccessInterval: 30
    FailureInterval: 120
    ServerUpdate: 00:00
RetireShips:
  Scheduler:
    SuccessInterval: 30
    FailureInterval: 120
    ServerUpdate: 00:00
DockCare:
  Scheduler:
    # Ships drop all along: about 50 a day on the F2P account, 11 an hour while farming an event
    SuccessInterval: 180
    FailureInterval: 120
    ServerUpdate: 00:00
DockExpand:
  Scheduler:
    # The dock fills as ships drop: read after DockCare, every 3 hours
    SuccessInterval: 180
    FailureInterval: 120
    ServerUpdate: 00:00
Handbook:
  Scheduler:
    # Missions of the Handbook get done all along, collected a few times a day
    SuccessInterval: 180
    FailureInterval: 120
    ServerUpdate: 00:00
LimitBreak:
  Scheduler:
    # Copies drop and are built all along, a ship of the fleets reaches levels 10, 30 and 70
    SuccessInterval: 180
    FailureInterval: 60
Formation:
  Scheduler:
    # Ships drop and are built all along, the fleets of a new account fill up slot by slot
    SuccessInterval: 60
    FailureInterval: 60
Inventory:
  Scheduler:
    # Once a week, a run goes through the whole dock, a run that stopped halfway is done again the next day
    SuccessInterval: 10080
    FailureInterval: 1440
    ServerUpdate: 00:00
Meowfficer:
  Scheduler:
    SuccessInterval: 30
    FailureInterval: 30
    ServerUpdate: 00:00
Guild:
